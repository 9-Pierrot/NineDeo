name: Release

# Publication d'une version : Actions → Release → « Run workflow » (version = 1.0.0),
# ou push d'un tag v*. Le workflow crée le tag et la release, compile l'exécutable
# Windows de l'hôte et joint les archives.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version à publier (ex. 1.0.0)"
        required: true
        default: "1.0.0"

permissions:
  contents: write

jobs:
  release:
    name: Paquets et exécutable Windows
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
      TAG: ${{ github.event.inputs.version && format('v{0}', github.event.inputs.version) || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Exécutable autonome de l'hôte (PyInstaller)
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File installer\windows\build_exe.ps1 -Python python
          if (-not (Test-Path installer\windows\dist\ninedeo_host\ninedeo_host.exe)) { throw 'build échoué' }
      - name: Archives
        shell: powershell
        run: |
          $v = $env:TAG.TrimStart('v')
          python tools\build_extension.py
          $stage = Join-Path $env:RUNNER_TEMP "NineDeo-$v"
          New-Item -ItemType Directory -Force $stage | Out-Null
          foreach ($p in 'extension', 'installer', 'README.md', 'logo.png') { Copy-Item -Recurse $p $stage }
          Remove-Item -Recurse -Force (Join-Path $stage 'installer\windows\build') -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force (Join-Path $stage 'docs') | Out-Null
          Copy-Item docs\*.pdf (Join-Path $stage 'docs')
          Compress-Archive -Path $stage -DestinationPath "dist\NineDeo-$v-windows.zip" -Force
          Get-ChildItem dist
      - name: Publication GitHub
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${TAG#v}"
          notes="Archive **NineDeo-$v-windows.zip** : décompresser, lancer \`installer\\windows\\install.bat\` (aucun Python requis, moteur pré-compilé inclus), puis charger le dossier \`extension\` dans \`chrome://extensions\` (mode développeur). Voir la notice PDF incluse."
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --target "$GITHUB_SHA" --title "NineDeo $v" --notes "$notes"
          gh release upload "$TAG" --clobber dist/*.zip "docs/NineDeo - Notice d'utilisation.pdf" "docs/NineDeo - Documentation technique.pdf"
